<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>錢錢相印</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#FFFFFF;--card:#F8F8F8;--card2:#F0F0F0;--border:#E2E2E2;
  --text:#1A1A1A;--mid:#666660;--dim:#AAAAAA;
  --green:#2D7A4F;--greenLt:#E8F5EE;
  --gold:#B8860B;--goldLt:#FFF8E1;
  --coffee:#7B5E3A;--coffeeLt:#F5EFE6;
  --danger:#D94040;--dangerLt:#FDECEA;
  --blue:#2B5FC2;--blueLt:#EEF3FF;
  --radius:14px;--radiusSm:10px;
}
body{font-family:-apple-system,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:72px;font-size:14px;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;outline:none;}

/* header */
.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
.hdr-title{font-size:15px;font-weight:800;color:var(--green);letter-spacing:2px;}
.hdr-sub{font-size:10px;color:var(--dim);margin-top:2px;}
.sync-badge{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600;}
.sync-ok{background:var(--greenLt);color:var(--green);}
.sync-ing{background:var(--goldLt);color:var(--gold);}

/* page content */
.page{display:none;padding:12px 14px 0;}
.page.active{display:block;}

/* card */
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);}
.card-title{font-size:13px;font-weight:700;margin-bottom:12px;}

/* sub tabs */
.subtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
.subtab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--mid);font-size:11px;font-weight:400;white-space:nowrap;transition:all .15s;}
.subtab.active{background:var(--greenLt);color:var(--green);border-color:var(--green);font-weight:700;}

/* progress bar */
.bar-wrap{background:var(--card2);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width .8s ease;}

/* grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.stat-card{background:var(--card);border-radius:12px;padding:10px 10px;border:1px solid var(--border);text-align:center;}
.stat-label{font-size:9px;color:var(--dim);margin-bottom:3px;}
.stat-val{font-size:13px;font-weight:700;}

/* input */
.inp{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;width:100%;}
.inp:focus{border-color:var(--green);}
.form-row{display:grid;gap:8px;margin-bottom:8px;}
.form-label{font-size:10px;color:var(--dim);margin-bottom:3px;}
.form-group{display:flex;flex-direction:column;}

/* buttons */
.btn-primary{background:var(--green);color:#fff;border-radius:var(--radiusSm);padding:10px;font-weight:700;font-size:13px;width:100%;}
.btn-outline{background:transparent;border:1px solid var(--border);border-radius:20px;padding:6px 16px;color:var(--mid);font-size:12px;font-weight:600;}
.btn-add{background:var(--green);border-radius:20px;padding:7px 16px;color:#fff;font-size:12px;font-weight:600;}
.add-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.add-bar-label{font-size:12px;font-weight:600;color:var(--mid);}

/* entry row */
.entry{background:var(--card);border-radius:11px;padding:10px 14px;margin-bottom:6px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.entry-desc{font-size:12px;font-weight:600;}
.entry-meta{font-size:10px;color:var(--dim);margin-top:2px;}
.entry-amt{font-size:13px;font-weight:700;}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;}
.nav-btn{flex:1;padding:10px 4px 8px;border:none;background:transparent;color:var(--dim);font-size:10px;border-top:2px solid transparent;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:1px;}
.nav-btn.active{color:var(--green);border-top-color:var(--green);}
.nav-icon{font-size:17px;}

/* alloc bars */
.alloc-row{margin-bottom:12px;}
.alloc-head{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;}

/* month section (collapsible) */
.month-section{background:var(--card);border-radius:var(--radius);margin-bottom:8px;border:1px solid var(--border);overflow:hidden;}
.month-header{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.month-header:active{background:var(--card2);}
.month-title{font-size:13px;font-weight:700;}
.month-summary{font-size:11px;color:var(--mid);}
.month-chevron{font-size:12px;color:var(--dim);transition:transform .2s;}
.month-chevron.open{transform:rotate(180deg);}
.month-body{display:none;padding:0 14px 12px;}
.month-body.open{display:block;}

/* analysis */
.analysis-over{background:var(--dangerLt);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.analysis-ok{background:var(--greenLt);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.analysis-tip{background:var(--blueLt);border-radius:8px;padding:10px 12px;}

/* settle */
.settle-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px;}
.settle-result{margin:10px 0;padding:10px 12px;border-radius:8px;font-size:12px;font-weight:600;}

/* checkbox */
.check-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mid);margin-bottom:10px;cursor:pointer;}
input[type=checkbox]{accent-color:var(--green);}

/* invest table */
.inv-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}
.inv-label{font-size:12px;font-weight:600;}
.inv-sub{font-size:10px;color:var(--dim);margin-top:2px;}
.inv-val{text-align:right;}
.inv-mv{font-size:13px;font-weight:700;}
.inv-pnl{font-size:11px;margin-top:2px;}

/* rebalance */
.rb-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:11px;}

/* budget hero */
.budget-hero{border-radius:var(--radius);padding:16px;margin-bottom:10px;border-width:2px;border-style:solid;}

/* empty state */
.empty{text-align:center;padding:28px 0;color:var(--dim);font-size:12px;}

/* tip */
.tip{font-size:10px;color:var(--dim);margin-top:6px;}

/* hidden */
.hidden{display:none!important;}

/* add form */
.add-form{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--green);}
</style>
</head>

// ── Storage (uses window.storage if available, else localStorage) ──
const useCloud = typeof window.storage !== 'undefined';

async function dbGet(k){
  if(useCloud){try{const r=await window.storage.get(k,true);return r?JSON.parse(r.value):null;}catch{return null;}}
  else{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
}
async function dbSet(k,v){
  if(useCloud){try{await window.storage.set(k,JSON.stringify(v),true);}catch{}}
  else{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
}

const todayStr=()=>new Date().toISOString().slice(0,10);
const ymNow=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;};
const ymLabel=ym=>{const[y,m]=ym.split('-');return `${y}年${parseInt(m)}月`;};
function catColor(cat){const i=CATS.indexOf(cat);return i>=0?CAT_COLORS[i]:'#888';}
function catShort(cat){return cat.replace(/^[^ ]+ /,'');}

// ── Budget period (resets on 15th) ──
function getPeriodStart(){
  const now=new Date(),today=todayStr();
  const ym=ymNow();
  const this15=`${ym}-15`;
  const prev=new Date(now.getFullYear(),now.getMonth()-1,1);
  const prev15=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}-15`;
  return today>=this15?this15:prev15;
}

function getSpentInPeriod(){
  const ps=getPeriodStart();
  return personal.filter(e=>e.date>=ps&&!e.cash).reduce((s,e)=>s+e.amt,0);
}

// ── All months with data ──
function getAllMonths(){
  const s=new Set([...personal.map(e=>e.date.slice(0,7)),...joint.map(e=>e.date.slice(0,7))]);
  return [...s].sort().reverse();
}

async function saveAll(){
  setBadge(true);

function setBadge(loading){

// ── Tab switch ──
function switchTab(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

function togglePaid(){

function closeAddForm(){

}

function submitAdd(){
  const desc=document.getElementById('fDesc')&&document.getElementById('fDesc').value.trim();
  const amt=document.getElementById('fAmt')&&parseFloat(document.getElementById('fAmt').value);
  const date=document.getElementById('fDate')&&document.getElementById('fDate').value;
  const cat=document.getElementById('fCat')&&document.getElementById('fCat').value;
  const who=document.getElementById('fWho')&&document.getElementById('fWho').value;
  const paid=document.getElementById('fPaid')&&document.getElementById('fPaid').value;
  const cash=document.getElementById('fCash')&&document.getElementById('fCash').checked;
  if(!desc){alert('請輸入說明');return;}
  if(!amt||amt<=0){alert('請輸入金額');return;}
  const id=Date.now();
  if(who==='個人'){personal=[{id,date,desc,amt,cat,cash},...personal];}

}

function barHTML(pct,color,h=8){
  return `<div class="bar-wrap" style="height:${h}px"><div class="bar-fill" style="width:${Math.min(Math.max(pct,0),100)}%;background:${color};height:${h}px"></div></div>`;

function entryHTML(e,src,allowDelete=false){
  const col=src==='j'?'var(--gold)':e.cash?'var(--dim)':'var(--green)';
  const cashTag=e.cash?` <span style="font-size:9px;background:var(--card2);color:var(--dim);border-radius:4px;padding:1px 5px">現金</span>`:'';

function deleteEntry(id,src){
  if(!confirm('確認刪除這筆記錄？'))return;

}

function emptyHTML(msg){return `<div class="empty">${msg||'尚無記錄'}</div>`;}

// ── Monthly analysis ──
function analyzeMonth(entries,limits,budget){
  const total=entries.reduce((s,e)=>s+e.amt,0);
  const bycat={};
  CATS.forEach(c=>{bycat[c]=entries.filter(e=>e.cat===c).reduce((s,e)=>s+e.amt,0);});
  const over=Object.entries(limits).map(([cat,lim])=>({cat,spent:bycat[cat]||0,lim,diff:(bycat[cat]||0)-lim})).filter(x=>x.diff>0).sort((a,b)=>b.diff-a.diff);
  return {total,bycat,over,budget};
}

function catBarsHTML(bycat,maxVal,title,titleColor){
  const entries=Object.entries(bycat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(!entries.length)return '';
  const max=maxVal||Math.max(...entries.map(([,v])=>v))||1;
  let h=`<div style="font-size:11px;font-weight:600;color:${titleColor||'var(--mid)'};margin-bottom:8px">${title}</div>`;
  entries.forEach(([cat,val])=>{
    const pct=val/max*100;
    const col=catColor(cat);
    h+=`<div style="margin-bottom:7px">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
        <span style="color:var(--text)">${catShort(cat)}</span>
        <span style="font-weight:600;color:var(--mid)">${fmt(val)}</span>
      </div>
      ${barHTML(pct,col,6)}
    </div>`;
  });
  return h;
}

function renderLedger(){
  const el=document.getElementById('page-ledger');
  const months=getAllMonths();
  const ym=ymNow();
  const monthP=personal.filter(e=>e.date.startsWith(ym)&&!e.cash).reduce((s,e)=>s+e.amt,0);
  const monthJ=joint.filter(e=>e.date.startsWith(ym)).reduce((s,e)=>s+e.amt,0);
  const sanPaid=joint.filter(e=>e.paid==='三').reduce((s,e)=>s+e.amt,0);
  const yePaid=joint.filter(e=>e.paid==='葉').reduce((s,e)=>s+e.amt,0);
  const diff=sanPaid-yePaid;

  const tabs=['流水','圖表','待結清'];
  const subTabsHTML=`<div class="subtabs">${tabs.map(t=>`<button class="subtab${ledgerSubTab===t?' active':''}" onclick="setLedgerTab('${t}')">${t}</button>`).join('')}</div>`;

  // 流水 - grouped by month, collapsible
  let flowHTML='';
  if(months.length===0){flowHTML=emptyHTML('尚無記錄');}
  else{
    months.forEach(m=>{
      const pE=personal.filter(e=>e.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
      const jE=joint.filter(e=>e.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
      const pTotal=pE.filter(e=>!e.cash).reduce((s,e)=>s+e.amt,0);
      const jTotal=jE.reduce((s,e)=>s+e.amt,0);
      const isOpen=m===ym;
      const entries=[...pE.map(e=>({...e,src:'p'})),...jE.map(e=>({...e,src:'j'}))].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
      flowHTML+=`<div class="month-section">
        <div class="month-header" onclick="toggleMonth('m${m.replace('-','')}')">
          <div>
            <div class="month-title">${ymLabel(m)}</div>
            <div class="month-summary">個人 ${fmt(pTotal)} · 共同 ${fmt(jTotal)}</div>
          </div>
          <span class="month-chevron${isOpen?' open':''}" id="chev-m${m.replace('-','')}">▼</span>
        </div>
        <div class="month-body${isOpen?' open':''}" id="m${m.replace('-','')}">
          ${entries.map(e=>entryHTML(e,e.src,true)).join('')||emptyHTML('本月尚無記錄')}
        </div>
      </div>`;
    });
  }

  // 圖表
  let chartHTML='';
  months.forEach(m=>{
    const pE=personal.filter(e=>e.date.startsWith(m)&&!e.cash);
    const jE=joint.filter(e=>e.date.startsWith(m));
    const pA=analyzeMonth(pE,P_LIMITS,PERSONAL_BUDGET);
    const jA=analyzeMonth(jE,J_LIMITS,JOINT_BUDGET);
    const pMax=Math.max(...CATS.map(c=>pA.bycat[c]||0),1);
    const jMax=Math.max(...CATS.map(c=>jA.bycat[c]||0),1);
    const isCur=m===ym;
    let overHTML='';
    const allOver=[...pA.over.map(x=>({...x,type:'個人'})),...jA.over.map(x=>({...x,type:'共同'}))].slice(0,3);
    if(allOver.length>0){
      overHTML=`<div class="analysis-over" style="margin-bottom:8px">
        <div style="font-size:11px;font-weight:700;color:var(--danger);margin-bottom:5px">⚠️ 超支項目</div>
        ${allOver.map(x=>`<div style="font-size:11px;color:var(--danger);margin-bottom:2px">${x.type} ${catShort(x.cat)}：超出 ${fmt(x.diff)}</div>`).join('')}
      </div>`;}
    let tipHTML='';
    const topP=pA.over[0],topJ=jA.over[0];
    const tipLines=[];
    if(topP)tipLines.push(`個人「${catShort(topP.cat)}」控制在 ${fmt(topP.lim)} 以內`);
    else if(pA.total>0)tipLines.push('個人支出控制良好 ✓');
    if(topJ)tipLines.push(`共同「${catShort(topJ.cat)}」注意控制`);
    else if(jA.total>0)tipLines.push('共同支出控制良好 ✓');
    if(tipLines.length>0){tipHTML=`<div class="analysis-tip"><div style="font-size:11px;font-weight:700;color:var(--blue);margin-bottom:4px">💡 下月建議</div>${tipLines.map(t=>`<div style="font-size:11px;color:var(--blue);margin-bottom:2px">${t}</div>`).join('')}</div>`;}
    chartHTML+=`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div class="card-title" style="margin-bottom:0">${ymLabel(m)}</div>
        ${isCur?`<span style="font-size:10px;background:var(--greenLt);color:var(--green);border-radius:20px;padding:2px 8px;font-weight:600">本月</span>`:''}
      </div>
      <div class="g2" style="margin-bottom:10px">
        <div style="background:var(--greenLt);border-radius:10px;padding:10px 12px">
          <div style="font-size:9px;color:var(--mid);margin-bottom:2px">個人支出</div>
          <div style="font-size:16px;font-weight:800;color:var(--green)">${fmt(pA.total)}</div>
          <div style="font-size:9px;color:${pA.total>PERSONAL_BUDGET?'var(--danger)':'var(--dim)'};margin-top:2px">${pA.total>PERSONAL_BUDGET?`超出 ${fmt(pA.total-PERSONAL_BUDGET)}`:`預算內 ${fmt(PERSONAL_BUDGET-pA.total)}`}</div>
        </div>
        <div style="background:var(--goldLt);border-radius:10px;padding:10px 12px">
          <div style="font-size:9px;color:var(--mid);margin-bottom:2px">共同支出</div>
          <div style="font-size:16px;font-weight:800;color:var(--gold)">${fmt(jA.total)}</div>
          <div style="font-size:9px;color:${jA.total>JOINT_BUDGET?'var(--danger)':'var(--dim)'};margin-top:2px">${jA.total>JOINT_BUDGET?`超出 ${fmt(jA.total-JOINT_BUDGET)}`:`預算內 ${fmt(JOINT_BUDGET-jA.total)}`}</div>
        </div>
      </div>
      ${pA.total>0?`<div style="margin-bottom:10px">${catBarsHTML(pA.bycat,pMax,'👤 個人消費分類','var(--green)')}</div>`:''}
      ${jA.total>0?`<div style="margin-bottom:10px">${catBarsHTML(jA.bycat,jMax,'👫 共同消費分類','var(--gold)')}</div>`:''}
      ${overHTML}${tipHTML}
    </div>`;
  });

  // 待結清
  const settleMsg=diff>0?`→ 葉 應匯三 ${fmt(Math.abs(diff)/2)}`:diff<0?`→ 三 應匯葉 ${fmt(Math.abs(diff)/2)}`:'✓ 目前平帳';
  const sc=diff!==0?'var(--danger)':'var(--green)';
  const sb=diff!==0?'var(--dangerLt)':'var(--greenLt)';
  const settleHTML=`<div class="card" style="border-color:var(--gold)">
    <div class="card-title">⚖️ 墊付結算</div>
    <div class="settle-row"><span style="color:var(--mid)">三 已墊</span><span style="font-weight:700;color:var(--green)">${fmt(sanPaid)}</span></div>
    <div class="settle-row" style="margin-bottom:10px"><span style="color:var(--mid)">葉 已墊</span><span style="font-weight:700;color:var(--gold)">${fmt(yePaid)}</span></div>
    <div style="padding:10px 12px;background:${sb};border-radius:8px;font-size:12px;font-weight:600;color:${sc};margin-bottom:12px">${settleMsg}</div>
    <button class="btn-primary" onclick="settle()">✓ 本月結清</button>
  </div>`;

  const contentMap={'流水':flowHTML,'圖表':chartHTML,'待結清':settleHTML};
  el.innerHTML=subTabsHTML+`<div>${contentMap[ledgerSubTab]}</div>`;
}

      txt+=`【個人明細】\n`;
      const bycat={};
      CATS.forEach(c=>{const v=pE.filter(e=>e.cat===c).reduce((s,e)=>s+e.amt,0);if(v>0)bycat[c]=v;});
      Object.entries(bycat).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{
        txt+=`  ${catShort(c).padEnd(8)}${fmt(v)}\n`;
      });
      txt+=`\n`;
    }
    // joint breakdown
    if(jE.length>0){
      txt+=`【共同明細】\n`;
      const bycat={};
      CATS.forEach(c=>{const v=jE.filter(e=>e.cat===c).reduce((s,e)=>s+e.amt,0);if(v>0)bycat[c]=v;});
      Object.entries(bycat).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{
        txt+=`  ${catShort(c).padEnd(8)}${fmt(v)}\n`;
      });
      txt+=`\n`;
    }
  });

  // 投資概況
  txt+=`━━━━━━━━━━━━━━━━━━━━━━━\n`;
  txt+=`📈 投資概況\n`;
  txt+=`━━━━━━━━━━━━━━━━━━━━━━━\n`;
  const p006=parseFloat(invest.price006208)||0;
  const p631=parseFloat(invest.price00631)||0;
  const mv006=invest.shares006208*p006;
  const mv631=invest.shares00631*p631;
  txt+=`006208 旅遊桶市值：${mv006>0?fmt(mv006):'尚未建倉'}\n`;
  txt+=`00631L 核心桶市值：${mv631>0?fmt(mv631):'尚未建倉'}\n`;
  txt+=`💰 銀彈桶現金：${fmt(invest.bullet||0)}\n`;
  txt+=`投資總規模：${fmt(mv006+mv631+(invest.bullet||0))}\n\n`;
  txt+=`══════════════════════════════\n`;
  txt+=`兩個人的錢，比一個人走得更遠\n`;
  txt+=`══════════════════════════════\n`;

  // copy to clipboard
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>{
      alert('✅ 報表已複製！\n\n可以貼到 LINE、備忘錄或 Notes 保存');
    }).catch(()=>fallbackCopy(txt));
  } else { fallbackCopy(txt); }
}

function fallbackCopy(txt){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');alert('✅ 報表已複製！\n\n可以貼到 LINE、備忘錄或 Notes 保存');}
  catch{alert('請長按以下文字手動複製：\n\n'+txt.slice(0,300)+'...');}
  document.body.removeChild(ta);
}

// ── RENDER INVEST ──
function renderInvest(){
  const el=document.getElementById('page-invest');
  const p006=parseFloat(invest.price006208)||0;
  const p631=parseFloat(invest.price00631)||0;
  const c006=parseFloat(invest.cost006208)||0;
  const c631=parseFloat(invest.cost00631)||0;
  const mv006=invest.shares006208*p006;
  const mv631=invest.shares00631*p631;
  const pnl006=mv006-invest.shares006208*c006;
  const pnl631=mv631-invest.shares00631*c631;
  const pp006=c006>0&&invest.shares006208>0?Math.round(pnl006/(invest.shares006208*c006)*100):0;
  const pp631=c631>0&&invest.shares00631>0?Math.round(pnl631/(invest.shares00631*c631)*100):0;
  const totalMV=mv006+mv631+(invest.bullet||0);

  function invField(key,label,isNum=false){
    return `<div class="form-group"><div class="form-label">${label}</div><input class="inp" type="number" placeholder="0" inputmode="numeric" value="${invest[key]||''}" onchange="updInv('${key}',${isNum}?Number(this.value):this.value)"/></div>`;
  }
  function pnlHTML(pnl,pp){
    if(!p006&&!p631)return '<span style="color:var(--dim)">—</span>';
    const col=pnl>=0?'var(--green)':'var(--danger)';
    return `<span style="color:${col};font-weight:700">${pnl>=0?'+':''}${fmt(pnl)} (${pp}%)</span>`;
  }

  el.innerHTML=`
    <div class="card">
      <div class="card-title">📋 投資策略</div>
      ${[['00631L 核心桶','每月 NT$3,500 · 曝險100%','var(--green)'],['💰 銀彈桶','每月 NT$3,000 · 等時機加碼','var(--gold)'],['006208 旅遊桶','每月 NT$4,000 · 現金存著不動','var(--coffee)']].map(([l,d,c])=>`
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px">
        <span style="font-weight:600;color:${c}">${l}</span>
        <span style="color:var(--mid);font-size:11px">${d}</span>
      </div>`).join('')}
    </div>
    <div class="card">
      <div class="card-title">📡 今日股價 & 成本</div>
      <div class="form-row" style="grid-template-columns:1fr 1fr">
        ${invField('price006208','006208 今日股價')}
        ${invField('price00631','00631L 今日股價')}
        ${invField('cost006208','006208 買入成本')}
        ${invField('cost00631','00631L 買入成本')}
      </div>
      <div class="form-row" style="grid-template-columns:1fr 1fr">
        ${invField('shares006208','006208 持有股數',true)}
        ${invField('shares00631','00631L 持有股數',true)}
      </div>
    </div>
    <div class="card">
      <div class="card-title">📦 持倉損益</div>
      <div class="inv-row"><div><div class="inv-label">✈️ 006208 旅遊桶</div><div class="inv-sub">市值</div></div><div class="inv-val"><div class="inv-mv">${p006>0?fmt(mv006):'—'}</div><div class="inv-pnl">${p006>0?pnlHTML(pnl006,pp006):'—'}</div></div></div>
      <div class="inv-row"><div><div class="inv-label">📈 00631L 核心桶</div><div class="inv-sub">市值</div></div><div class="inv-val"><div class="inv-mv">${p631>0?fmt(mv631):'—'}</div><div class="inv-pnl">${p631>0?pnlHTML(pnl631,pp631):'—'}</div></div></div>
      <div style="margin-top:10px">
        <div class="form-label">💰 銀彈桶現金</div>
        <input class="inp" type="number" placeholder="累計金額" inputmode="numeric" value="${invest.bullet||''}" onchange="updInv('bullet',Number(this.value))"/>
      </div>
      <div style="margin-top:10px;padding:10px 12px;background:var(--greenLt);border-radius:10px">
        <div style="font-size:10px;color:var(--mid)">投資總規模</div>
        <div style="font-size:20px;font-weight:800;color:var(--green);margin-top:2px">${totalMV>0?fmt(totalMV):'—'}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">🔄 再平衡規則</div>
      ${[['獲利 > 65%','賣出轉旅遊現金','var(--green)'],['虧損 < 35%','銀彈加碼攤平','var(--gold)'],['旅遊桶報酬 > 10%','撥 50% 獲利','var(--green)'],['旅遊桶報酬 5～10%','撥 30% 獲利','var(--coffee)'],['旅遊桶虧損','不動等回本','var(--danger)']].map(([c,a,col])=>`
      <div class="rb-row"><span style="color:var(--mid)">${c}</span><span style="font-weight:600;color:${col}">${a}</span></div>`).join('')}

function updInv(k,v){invest[k]=v;saveAll();renderInvest();}

function updateHdrDate(){
